<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sorteos Pro Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #ffffff;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
    }
    .title { font-size: 14px; font-weight: 700; }
    .subtitle { font-size: 11px; color: rgba(255, 255, 255, 0.6); }
    .content { padding: 16px 0; }
    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      margin-bottom: 6px;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #030712;
      border: none;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .footer {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🎁</div>
    <div>
      <div class="title">Sorteos Pro</div>
      <div class="subtitle">Extractor Oficial 1-Clic</div>
    </div>
  </div>

  <div class="content">
    <div class="status-card">
      <div class="badge" id="badge">Detectando pestaña...</div>
      <div id="tab-info">Verificando si estás en una publicación de X o Sorteos Pro...</div>
    </div>

    <button id="extract-btn" class="btn">
      <span>⚡ Extraer Comentarios Reales</span>
    </button>
  </div>

  <div class="footer">100% comentarios reales sin límites API</div>

  <script src="popup.js"></script>
</body>
</html>
