<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_mp3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="wave_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow_mp3">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg_mp3)"/>
  <circle cx="400" cy="225" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glow_mp3)"/>

  <!-- Audio Waveform Visualization in Center -->
  <g transform="translate(150, 160)">
    <rect x="0" y="30" width="8" height="40" rx="4" fill="url(#wave_grad)"/>
    <rect x="18" y="15" width="8" height="70" rx="4" fill="url(#wave_grad)"/>
    <rect x="36" y="5" width="8" height="90" rx="4" fill="url(#wave_grad)"/>
    <rect x="54" y="25" width="8" height="50" rx="4" fill="url(#wave_grad)"/>
    <rect x="72" y="35" width="8" height="30" rx="4" fill="url(#wave_grad)"/>
    <rect x="90" y="10" width="8" height="80" rx="4" fill="url(#wave_grad)"/>
    <rect x="108" y="0" width="8" height="100" rx="4" fill="url(#wave_grad)"/>
    <rect x="126" y="20" width="8" height="60" rx="4" fill="url(#wave_grad)"/>
    
    <!-- Headphones Center Emblem -->
    <circle cx="250" cy="50" r="50" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow_mp3)"/>
    <text x="250" y="62" text-anchor="middle" font-size="34">🎧</text>
    
    <rect x="364" y="20" width="8" height="60" rx="4" fill="url(#wave_grad)"/>
    <rect x="382" y="0" width="8" height="100" rx="4" fill="url(#wave_grad)"/>
    <rect x="400" y="10" width="8" height="80" rx="4" fill="url(#wave_grad)"/>
    <rect x="418" y="35" width="8" height="30" rx="4" fill="url(#wave_grad)"/>
    <rect x="436" y="25" width="8" height="50" rx="4" fill="url(#wave_grad)"/>
    <rect x="454" y="5" width="8" height="90" rx="4" fill="url(#wave_grad)"/>
    <rect x="472" y="15" width="8" height="70" rx="4" fill="url(#wave_grad)"/>
    <rect x="490" y="30" width="8" height="40" rx="4" fill="url(#wave_grad)"/>
  </g>

  <!-- Bottom Quality Indicator Badges -->
  <g transform="translate(250, 290)">
    <rect width="300" height="45" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow_mp3)"/>
    <circle cx="30" cy="22" r="10" fill="#10b981"/>
    <text x="30" y="26" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="900">✓</text>
    <text x="55" y="28" fill="#f8fafc" font-size="13" font-weight="900" font-family="system-ui">MP3 320 KBPS • ESTÉREO HI-FI</text>
  </g>

  <!-- Top Badge -->
  <rect x="280" y="30" width="240" height="34" rx="17" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="400" y="52" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">🎵 AUDIO EN MÁXIMA RESOLUCIÓN</text>
</svg>