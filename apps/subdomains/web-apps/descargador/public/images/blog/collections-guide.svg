<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_col" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <filter id="glow_col">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg_col)"/>

  <!-- Folders Architecture 3D Stack -->
  <g transform="translate(180, 100)">
    <!-- Folder 1 -->
    <rect x="0" y="40" width="440" height="80" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <text x="30" y="85" font-size="24">📁</text>
    <text x="75" y="80" fill="#f8fafc" font-size="14" font-weight="bold">2026 / TikTok &amp; Reels / [1080p]</text>

    <!-- Folder 2 (Active Center) -->
    <rect x="20" y="100" width="440" height="85" rx="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#glow_col)"/>
    <text x="50" y="150" font-size="28">🎬</text>
    <text x="100" y="142" fill="#ffffff" font-size="15" font-weight="900">Mi_Coleccion_Personal_Jellyfin</text>
    <text x="100" y="162" fill="#c084fc" font-size="11">Catalogado por año, creador y resolución</text>

    <!-- Folder 3 -->
    <rect x="40" y="170" width="440" height="75" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.85"/>
    <text x="70" y="215" font-size="24">🎵</text>
    <text x="115" y="210" fill="#f8fafc" font-size="14" font-weight="bold">Musica_HQ / MP3_320kbps / Soundtracks</text>
  </g>

  <!-- Top Badge -->
  <rect x="260" y="30" width="280" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="400" y="52" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">🗂️ ORGANIZACIÓN Y GESTIÓN MULTIMEDIA</text>
</svg>