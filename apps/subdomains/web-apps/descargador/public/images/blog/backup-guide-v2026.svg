<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_backup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="shield_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow_backup" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg_backup)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="270" x2="800" y2="270"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/><line x1="320" y1="0" x2="320" y2="450"/><line x1="480" y1="0" x2="480" y2="450"/><line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glowing Aura Center -->
  <circle cx="400" cy="225" r="140" fill="#6366f1" opacity="0.18" filter="url(#glow_backup)"/>

  <!-- 3-2-1 Architecture Visual Cards -->
  <!-- 1. Master Copy (Center) -->
  <g transform="translate(290, 105)">
    <rect width="220" height="150" rx="20" fill="url(#card_glass)" stroke="#818cf8" stroke-width="1.8" filter="url(#glow_backup)"/>
    <rect x="15" y="15" width="40" height="40" rx="10" fill="#4f46e5" opacity="0.3"/>
    <path d="M35 25v20M25 35h20" stroke="#a5b4fc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hard Drive Icon -->
    <circle cx="110" cy="70" r="32" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <circle cx="110" cy="70" r="12" fill="#818cf8"/>
    <text x="110" y="125" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="800" font-family="system-ui, sans-serif">REGLA 3-2-1 PRO</text>
    <text x="110" y="140" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Master 4K • Checksums</text>
  </g>

  <!-- Left Node: Local SSD -->
  <g transform="translate(100, 260)">
    <rect width="170" height="85" rx="16" fill="url(#card_glass)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="40" cy="42" r="18" fill="#0284c7" opacity="0.25"/>
    <text x="40" y="47" text-anchor="middle" font-size="16">💾</text>
    <text x="70" y="38" fill="#f8fafc" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Copia Local</text>
    <text x="70" y="55" fill="#38bdf8" font-size="10" font-mono font-family="monospace">SSD NVMe / NAS</text>
  </g>

  <!-- Center Node: Encrypted Cloud -->
  <g transform="translate(315, 275)">
    <rect width="170" height="85" rx="16" fill="url(#card_glass)" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="40" cy="42" r="18" fill="#7e22ce" opacity="0.25"/>
    <text x="40" y="47" text-anchor="middle" font-size="16">☁️</text>
    <text x="70" y="38" fill="#f8fafc" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Nube Cifrada</text>
    <text x="70" y="55" fill="#c084fc" font-size="10" font-mono font-family="monospace">Zero-Knowledge</text>
  </g>

  <!-- Right Node: Cold Offline -->
  <g transform="translate(530, 260)">
    <rect width="170" height="85" rx="16" fill="url(#card_glass)" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="40" cy="42" r="18" fill="#047857" opacity="0.25"/>
    <text x="40" y="47" text-anchor="middle" font-size="16">🔒</text>
    <text x="70" y="38" fill="#f8fafc" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Cold Storage</text>
    <text x="70" y="55" fill="#34d399" font-size="10" font-mono font-family="monospace">Air-Gapped 2026</text>
  </g>

  <!-- Connecting Curved Glow Lines -->
  <path d="M270 300 Q 340 240, 370 240" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6"/>
  <path d="M400 275 L 400 255" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6"/>
  <path d="M530 300 Q 460 240, 430 240" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6"/>

  <!-- Top Badge -->
  <rect x="300" y="30" width="200" height="34" rx="17" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
  <text x="400" y="52" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">🛡️ PRESERVACIÓN DIGITAL 2026</text>
</svg>