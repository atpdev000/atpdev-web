<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_tools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1a103c"/>
    </linearGradient>
    <filter id="glow_tools">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg_tools)"/>
  <circle cx="400" cy="225" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#glow_tools)"/>

  <!-- Center Hub: Descargador Pro Gear -->
  <g transform="translate(340, 165)">
    <circle cx="60" cy="60" r="55" fill="#4f46e5" stroke="#a5b4fc" stroke-width="2.5" filter="url(#glow_tools)"/>
    <text x="60" y="68" text-anchor="middle" font-size="34">⚡</text>
    <text x="60" y="135" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="900" font-family="system-ui">DESCARGADOR PRO</text>
  </g>

  <!-- Surrounding Tool Satellites -->
  <!-- Top Left: Video Editor -->
  <g transform="translate(140, 110)">
    <rect width="140" height="60" rx="14" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="30" y="37" font-size="18">🎬</text>
    <text x="55" y="32" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui">CapCut / DaVinci</text>
    <text x="55" y="48" fill="#f472b6" font-size="9" font-family="system-ui">Edición 4K</text>
  </g>

  <!-- Bottom Left: Subtitles AI -->
  <g transform="translate(120, 240)">
    <rect width="140" height="60" rx="14" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="37" font-size="18">💬</text>
    <text x="55" y="32" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui">Whisper AI</text>
    <text x="55" y="48" fill="#38bdf8" font-size="9" font-family="system-ui">Subtítulos Auto</text>
  </g>

  <!-- Top Right: Audio Legal -->
  <g transform="translate(520, 110)">
    <rect width="140" height="60" rx="14" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="37" font-size="18">🎵</text>
    <text x="55" y="32" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui">Artlist / Epidemic</text>
    <text x="55" y="48" fill="#34d399" font-size="9" font-family="system-ui">Audio sin DMCA</text>
  </g>

  <!-- Bottom Right: Analytics -->
  <g transform="translate(540, 240)">
    <rect width="140" height="60" rx="14" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="30" y="37" font-size="18">📊</text>
    <text x="55" y="32" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui">Viral Trends</text>
    <text x="55" y="48" fill="#fbbf24" font-size="9" font-family="system-ui">Analítica 2026</text>
  </g>

  <!-- Connecting Lines -->
  <line x1="280" y1="140" x2="355" y2="190" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="260" y1="270" x2="355" y2="245" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="520" y1="140" x2="445" y2="190" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="540" y1="270" x2="445" y2="245" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

  <!-- Top Badge -->
  <rect x="260" y="30" width="280" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="400" y="52" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">🚀 STACK DE HERRAMIENTAS 2026</text>
</svg>