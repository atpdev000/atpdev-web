<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_fmt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mp4_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mkv_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="webm_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg_fmt)"/>

  <!-- 3 Pillar Columns -->
  <!-- 1. MP4 (Universal) -->
  <g transform="translate(80, 95)">
    <rect width="190" height="260" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="20" y="20" width="150" height="50" rx="12" fill="url(#mp4_grad)"/>
    <text x="95" y="52" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui">MP4</text>
    <text x="95" y="100" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold" font-family="system-ui">COMPATIBILIDAD</text>
    <text x="95" y="125" text-anchor="middle" fill="#34d399" font-size="13" font-weight="900" font-family="system-ui">★★★★★ 100%</text>
    <path d="M30 145h130" stroke="#334155" stroke-width="1"/>
    <text x="95" y="170" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui">iPhones • Android</text>
    <text x="95" y="195" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui">Smart TVs • Consolas</text>
    <text x="95" y="220" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui">H.264 / H.265 / AV1</text>
    <rect x="30" y="235" width="130" height="18" rx="9" fill="#1d4ed8" opacity="0.3"/>
    <text x="95" y="248" text-anchor="middle" fill="#60a5fa" font-size="9" font-weight="bold">ESTÁNDAR UNIVERSAL</text>
  </g>

  <!-- 2. MKV (Master Quality) -->
  <g transform="translate(305, 95)">
    <rect width="190" height="260" rx="20" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="20" y="20" width="150" height="50" rx="12" fill="url(#mkv_grad)"/>
    <text x="95" y="52" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui">MKV</text>
    <text x="95" y="100" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold" font-family="system-ui">FLEXIBILIDAD</text>
    <text x="95" y="125" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="900" font-family="system-ui">★★★★☆ 85%</text>
    <path d="M30 145h130" stroke="#334155" stroke-width="1"/>
    <text x="95" y="170" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui">Audio Multilingüe</text>
    <text x="95" y="195" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui">Subtítulos ASS/SSA</text>
    <text x="95" y="220" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui">Ideal para Cine/Series</text>
    <rect x="30" y="235" width="130" height="18" rx="9" fill="#6d28d9" opacity="0.3"/>
    <text x="95" y="248" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="bold">ALTA FIDELIDAD</text>
  </g>

  <!-- 3. WebM (Web Speed) -->
  <g transform="translate(530, 95)">
    <rect width="190" height="260" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="20" y="20" width="150" height="50" rx="12" fill="url(#webm_grad)"/>
    <text x="95" y="52" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="900" font-family="system-ui">WebM</text>
    <text x="95" y="100" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="bold" font-family="system-ui">OPTIMIZACIÓN WEB</text>
    <text x="95" y="125" text-anchor="middle" fill="#34d399" font-size="13" font-weight="900" font-family="system-ui">★★★★☆ 90%</text>
    <path d="M30 145h130" stroke="#334155" stroke-width="1"/>
    <text x="95" y="170" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui">Códec VP9 / AV1</text>
    <text x="95" y="195" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui">Audio Opus HD</text>
    <text x="95" y="220" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="system-ui">Poco peso • Web</text>
    <rect x="30" y="235" width="130" height="18" rx="9" fill="#047857" opacity="0.3"/>
    <text x="95" y="248" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="bold">ULTRALIGERO</text>
  </g>

  <!-- Top Badge -->
  <rect x="270" y="30" width="260" height="34" rx="17" fill="#0f172a" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="400" y="52" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">⚖️ GUÍA DE FORMATOS Y CÓDECS 2026</text>
</svg>