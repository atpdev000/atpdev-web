<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_cbr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow_cbr">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg_cbr)"/>
  <circle cx="400" cy="225" r="140" fill="#06b6d4" opacity="0.18" filter="url(#glow_cbr)"/>

  <!-- Cyber Shield &amp; Lock Center -->
  <g transform="translate(300, 105)">
    <rect width="200" height="220" rx="30" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow_cbr)"/>
    <circle cx="100" cy="75" r="40" fill="#0891b2" opacity="0.3"/>
    <text x="100" y="88" text-anchor="middle" font-size="40">🛡️</text>
    <text x="100" y="145" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="900">DESCARGAS SEGURAS</text>
    <text x="100" y="165" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="bold">SSL 256-Bit • Cero Malware</text>
    <rect x="30" y="180" width="140" height="22" rx="6" fill="#0e7490" opacity="0.4"/>
    <text x="100" y="195" text-anchor="middle" fill="#a5f3fc" font-size="9" font-weight="bold">SIN POPUPS MALICIOSOS</text>
  </g>

  <!-- Left: Threat Blocked -->
  <g transform="translate(80, 150)">
    <rect width="180" height="120" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
    <text x="25" y="35" fill="#f87171" font-size="12" font-weight="bold">🚫 Amenazas Bloqueadas</text>
    <text x="25" y="65" fill="#cbd5e1" font-size="10">• Falsos instaladores .exe</text>
    <text x="25" y="90" fill="#cbd5e1" font-size="10">• Spyware en extensiones</text>
  </g>

  <!-- Right: Clean Files -->
  <g transform="translate(540, 150)">
    <rect width="180" height="120" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="25" y="35" fill="#34d399" font-size="12" font-weight="bold">✅ Archivos Limpios</text>
    <text x="25" y="65" fill="#cbd5e1" font-size="10">• Streams MP4/MP3 puros</text>
    <text x="25" y="90" fill="#cbd5e1" font-size="10">• Cifrado HTTPS en tránsito</text>
  </g>

  <!-- Top Badge -->
  <rect x="260" y="30" width="280" height="34" rx="17" fill="#083344" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="400" y="52" text-anchor="middle" fill="#a5f3fc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">🔒 CIBERSEGURIDAD Y PROTECCIÓN 2026</text>
</svg>