<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_vs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow_vs">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg_vs)"/>

  <!-- Left: Streaming Cloud with Question/Buffer -->
  <g transform="translate(100, 110)">
    <rect width="250" height="200" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="125" y="45" text-anchor="middle" font-size="34">📡</text>
    <text x="125" y="80" text-anchor="middle" fill="#f59e0b" font-size="18" font-weight="900">STREAMING</text>
    <text x="125" y="115" text-anchor="middle" fill="#fca5a5" font-size="11">• Dependencia de conexión</text>
    <text x="125" y="140" text-anchor="middle" fill="#fca5a5" font-size="11">• Borrado repentino de series</text>
    <text x="125" y="165" text-anchor="middle" fill="#fca5a5" font-size="11">• Cuotas mensuales ($500/año)</text>
  </g>

  <!-- VS Emblem Center -->
  <g transform="translate(370, 180)">
    <circle cx="30" cy="30" r="28" fill="#ef4444" filter="url(#glow_vs)"/>
    <text x="30" y="38" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="900">VS</text>
  </g>

  <!-- Right: Local Master Download -->
  <g transform="translate(450, 110)">
    <rect width="250" height="200" rx="24" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#glow_vs)"/>
    <text x="125" y="45" text-anchor="middle" font-size="34">💾</text>
    <text x="125" y="80" text-anchor="middle" fill="#10b981" font-size="18" font-weight="900">DESCARGA LOCAL</text>
    <text x="125" y="115" text-anchor="middle" fill="#86efac" font-size="11">• Disponible para siempre</text>
    <text x="125" y="140" text-anchor="middle" fill="#86efac" font-size="11">• Cero consumo de datos móviles</text>
    <text x="125" y="165" text-anchor="middle" fill="#86efac" font-size="11">• Privacidad total &amp; 1080p real</text>
  </g>

  <!-- Top Badge -->
  <rect x="250" y="30" width="300" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="400" y="52" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">⚔️ STREAMING vs ARCHIVO PERMANENTE</text>
</svg>