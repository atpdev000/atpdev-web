<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_opt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <filter id="glow_opt">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg_opt)"/>

  <!-- Smartphone Frame Center (9:16 Ratio) -->
  <g transform="translate(325, 90)">
    <rect width="150" height="270" rx="24" fill="#020617" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow_opt)"/>
    <rect x="10" y="15" width="130" height="240" rx="16" fill="#0f172a"/>
    <!-- Safe Zone Overlay Box -->
    <rect x="20" y="45" width="110" height="175" rx="8" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="75" y="130" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="900" font-family="system-ui">ZONA SEGURA</text>
    <text x="75" y="145" text-anchor="middle" fill="#86efac" font-size="9" font-family="system-ui">70% Central</text>

    <!-- Blocked UI areas (Top / Bottom) -->
    <rect x="20" y="20" width="110" height="20" rx="4" fill="#ef4444" opacity="0.25"/>
    <text x="75" y="34" text-anchor="middle" fill="#fca5a5" font-size="8">UI Sistema (Evitar)</text>
    <rect x="20" y="225" width="110" height="25" rx="4" fill="#ef4444" opacity="0.25"/>
    <text x="75" y="241" text-anchor="middle" fill="#fca5a5" font-size="8">Descripción / Audio</text>
  </g>

  <!-- Left Chart: Aspect Ratios -->
  <g transform="translate(80, 130)">
    <rect width="200" height="180" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="100" y="32" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui">RESOLUCIONES 2026</text>
    <rect x="20" y="48" width="160" height="28" rx="6" fill="#0284c7" opacity="0.25"/>
    <text x="30" y="66" fill="#38bdf8" font-size="10" font-weight="bold">9:16 Vertical</text>
    <text x="165" y="66" text-anchor="end" fill="#ffffff" font-size="10">1080x1920</text>
    <rect x="20" y="85" width="160" height="28" rx="6" fill="#7c3aed" opacity="0.25"/>
    <text x="30" y="103" fill="#a78bfa" font-size="10" font-weight="bold">16:9 Panorámico</text>
    <text x="165" y="103" text-anchor="end" fill="#ffffff" font-size="10">1920x1080</text>
    <rect x="20" y="122" width="160" height="28" rx="6" fill="#059669" opacity="0.25"/>
    <text x="30" y="140" fill="#34d399" font-size="10" font-weight="bold">1:1 Cuadrado</text>
    <text x="165" y="140" text-anchor="end" fill="#ffffff" font-size="10">1080x1080</text>
  </g>

  <!-- Right Chart: Bitrate Health -->
  <g transform="translate(520, 130)">
    <rect width="200" height="180" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="100" y="32" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui">BITRATE RECOMENDADO</text>
    <!-- Bar 1 -->
    <text x="25" y="70" fill="#94a3b8" font-size="10">TikTok</text>
    <rect x="75" y="60" width="105" height="14" rx="4" fill="#06b6d4"/>
    <!-- Bar 2 -->
    <text x="25" y="105" fill="#94a3b8" font-size="10">Reels</text>
    <rect x="75" y="95" width="95" height="14" rx="4" fill="#ec4899"/>
    <!-- Bar 3 -->
    <text x="25" y="140" fill="#94a3b8" font-size="10">Shorts</text>
    <rect x="75" y="130" width="115" height="14" rx="4" fill="#ef4444"/>
    <text x="100" y="168" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">12 - 16 Mbps Óptimo</text>
  </g>

  <!-- Top Badge -->
  <rect x="260" y="30" width="280" height="34" rx="17" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
  <text x="400" y="52" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">📐 OPTIMIZACIÓN Y ZONAS SEGURAS</text>
</svg>