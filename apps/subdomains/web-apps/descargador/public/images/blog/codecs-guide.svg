<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg_cdc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="glow_cdc">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg_cdc)"/>

  <!-- Codec Race: AV1 vs HEVC vs H264 -->
  <g transform="translate(100, 100)">
    <!-- 1. AV1 Leader -->
    <rect x="0" y="0" width="600" height="65" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow_cdc)"/>
    <text x="30" y="40" fill="#38bdf8" font-size="22" font-weight="900" font-family="system-ui">AV1</text>
    <rect x="120" y="20" width="350" height="25" rx="6" fill="#0284c7"/>
    <text x="490" y="37" fill="#f8fafc" font-size="12" font-weight="bold">+50% EFICIENTE</text>
    <text x="135" y="37" fill="#ffffff" font-size="11" font-weight="bold">Futuro Abierto • YouTube / Netflix</text>

    <!-- 2. HEVC / H.265 -->
    <rect x="0" y="85" width="600" height="65" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="30" y="125" fill="#a78bfa" font-size="22" font-weight="900" font-family="system-ui">HEVC</text>
    <rect x="120" y="105" width="260" height="25" rx="6" fill="#6d28d9"/>
    <text x="400" y="122" fill="#f8fafc" font-size="12" font-weight="bold">+30% EFICIENTE</text>
    <text x="135" y="122" fill="#ffffff" font-size="11" font-weight="bold">Estándar 4K TV &amp; Móvil</text>

    <!-- 3. AVC / H.264 -->
    <rect x="0" y="170" width="600" height="65" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="30" y="210" fill="#94a3b8" font-size="22" font-weight="900" font-family="system-ui">H.264</text>
    <rect x="120" y="190" width="160" height="25" rx="6" fill="#475569"/>
    <text x="300" y="207" fill="#94a3b8" font-size="12" font-weight="bold">LEGACY (COMPATIBILIDAD 100%)</text>
    <text x="135" y="207" fill="#ffffff" font-size="11" font-weight="bold">Base Universal</text>
  </g>

  <!-- Top Badge -->
  <rect x="270" y="30" width="260" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="400" y="52" text-anchor="middle" fill="#bae6fd" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">⚡ GUERRA DE CÓDECS: AV1 vs HEVC</text>
</svg>